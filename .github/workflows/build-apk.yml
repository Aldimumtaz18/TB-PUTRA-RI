name: Build APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build TB PUTRA RI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 & accept licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-36" || true
          sdkmanager "platforms;android-36.1" || true
          sdkmanager "build-tools;36.0.0" || true

      - name: Prepare build files & debug keystore
        run: |
          if [ ! -f .env.example ] && [ ! -f .env ]; then
            touch .env.example
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache

      - name: Rename APK output
        run: cp app/build/outputs/apk/debug/app-debug.apk TB-PUTRA-RI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TB-PUTRA-RI-APK
          path: TB-PUTRA-RI.apk

      - name: Publish latest APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk TB-PUTRA-RI.apk --clobber
          else
            gh release create latest-apk TB-PUTRA-RI.apk \
              --title "TB PUTRA RI - APK Terbaru" \
              --notes "File APK siap install untuk Android." \
              --latest
          fi
