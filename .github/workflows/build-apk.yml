name: Build APK Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build TB PUTRA RI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK output
        run: cp app/build/outputs/apk/debug/app-debug.apk TB-PUTRA-RI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TB-PUTRA-RI-APK
          path: TB-PUTRA-RI.apk

      - name: Publish latest APK to GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk TB-PUTRA-RI.apk --clobber
          else
            gh release create latest-apk TB-PUTRA-RI.apk \
              --title "TB PUTRA RI - APK Terbaru" \
              --notes "File APK siap install untuk Android." \
              --latest
          fi
